name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Unit + feature tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The suite never launches a browser, reaches the network, or touches the
      # macOS Keychain / Messages DB (all mocked), so it runs on Linux without
      # `playwright install`. pytest config (addopts + coverage gate) lives in
      # pyproject.toml, so a bare `pytest` enforces the >=95% coverage floor.
      - name: Run tests with coverage gate
        run: pytest
