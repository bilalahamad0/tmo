[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = """\
    -ra \
    --cov \
    --cov-report=term-missing \
    --cov-fail-under=95 \
"""

[tool.coverage.run]
branch = true
source = ["."]
omit = [
    "tests/*",
    "tmobile_env/*",
    "*/site-packages/*",
    # Playwright-driven modules only run against live T-Mobile / Bank of
    # America sessions; mocking a real bank is unsafe and unrealistic, so
    # their browser flows stay out of the coverage gate (see README "Tests").
    # Their pure helpers (regexes, hashing, the live-send flag) are still
    # exercised by tests/test_zelle_pay.py and tests/test_download_bill.py.
    "download_bill.py",
    "zelle_pay.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
